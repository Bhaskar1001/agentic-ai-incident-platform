[project]
name = "agentic-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.28.1",
    "langgraph>=1.2.11",
    "mcp>=2.3.0",
    "numpy>=2.2.6",
    "ollama>=0.6.2",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.1.0",
]

[project.scripts]
agentic-ai = "agentic_ai:main"
agentic-ai-mcp = "agentic_ai.mcp_server.server:main"
agentic-ai-demo = "agentic_ai.cli:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
markers = [
    "live: calls a real LLM provider; skipped when no credentials are configured",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
]
ignore = [
    "E501",
    "E731",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401", "F841"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
