name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-lint:
    name: Test & Code Quality
    runs-on: ubuntu-latest

    # A real PostgreSQL so the DATABASE_URL-gated tests run in CI instead of skipping.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.10"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.10

      - name: Install dependencies from lockfile
        run: uv sync --frozen --all-groups

      - name: Run Ruff Lint Check
        run: uv run ruff check .

      - name: Run Ruff Format Check
        run: uv run ruff format --check .

      - name: Run Automated Test Suite
        env:
          LLM_PROVIDER: openrouter
          LOG_LEVEL: INFO
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          set -o pipefail
          uv run pytest -v -rfE --tb=short 2>&1 | tee pytest-output.txt

      # The job log needs repository admin rights to download; annotations are readable by anyone
      # who can see the run. So when the suite fails, say which tests failed and why, there.
      - name: Report test failures as annotations
        if: failure()
        run: |
          failed=$(grep -E '^(FAILED|ERROR) ' pytest-output.txt | head -30 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}')
          echo "::error title=Failing tests::${failed:-no FAILED/ERROR lines found; see the log}"
          detail=$(grep -nE '^(E  |tests/.*(Error|Exception))' pytest-output.txt | head -40 | cut -c1-220 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}')
          echo "::error title=First failure details::${detail:-none captured}"
          summary=$(tail -n 5 pytest-output.txt | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}')
          echo "::error title=pytest summary::${summary}"

